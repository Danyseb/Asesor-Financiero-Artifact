<title>Asesor Financiero de Dany</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: libro de cuentas — encabezado fijo, pestañas por área, cada pestaña abre con su resumen y baja al detalle. */
/* Claro: blanco + azul. Oscuro: negro + naranja. Un solo acento por tema; el rojo queda reservado para "excedido". */
:root{
  --bg:#f5f8fd; --surface:#ffffff; --sunk:#eaf0fa; --ink:#0e1d38; --ink-2:#3d4e6e; --ink-3:#7a89a6;
  --line:#dde5f2; --line-2:#c3d0e6; --accent:#1d5fd6; --accent-ink:#ffffff; --accent-soft:#e3ecfc;
  --red:#d13a2f; --red-bg:#fbe9e7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0908; --surface:#141210; --sunk:#1c1814; --ink:#f5ede4; --ink-2:#c7b8a8; --ink-3:#8c7f72;
  --line:#2a231d; --line-2:#3d3228; --accent:#ff7a1a; --accent-ink:#140a02; --accent-soft:#2e1a0a;
  --red:#f2365f; --red-bg:#3a1220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0908; --surface:#141210; --sunk:#1c1814; --ink:#f5ede4; --ink-2:#c7b8a8; --ink-3:#8c7f72;
  --line:#2a231d; --line-2:#3d3228; --accent:#ff7a1a; --accent-ink:#140a02; --accent-soft:#2e1a0a;
  --red:#f2365f; --red-bg:#3a1220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h1 span{color:var(--accent)}
h2{font-size:1.3rem;font-weight:750}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.num,input[type=number]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
a{color:var(--ink)}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;padding-block:22px 14px}
.brand small{display:block;color:var(--ink-3);font-size:.82rem;margin-top:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line-2);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:22px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:11px 12px 10px;text-decoration:none;color:var(--ink-2);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;font-size:.93rem}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav.tabs a:hover{color:var(--accent)}
nav.tabs a .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-family:var(--f-num);text-align:center}
section.view{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent-soft);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--r);background:var(--surface)}
.kpi{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--f-num);font-size:1.45rem;font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.82rem;color:var(--ink-2);margin-top:2px}
@media (max-width:640px){.kpi{border-right:0;border-bottom:1px solid var(--line)}.kpi:last-child{border-bottom:0}}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px dashed var(--accent);border-radius:var(--r);padding:12px 16px;background:var(--accent-soft)}
button,.btn{font:inherit;font-size:.9rem;font-weight:600;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;cursor:pointer;line-height:1.2}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
button.link{background:none;border:0;padding:4px 6px;color:var(--ink-2);text-decoration:underline;font-weight:500}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--ink-2);font-weight:500;min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 12px;align-items:end}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tr.exc td:first-child{box-shadow:inset 3px 0 var(--red)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:.74rem;font-weight:600;white-space:nowrap;border:1px solid var(--line-2);color:var(--ink-2)}
.pill.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.pill.risk{border-color:var(--accent);color:var(--accent)}
.pill.risk::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pill.exc{background:var(--red);border-color:var(--red);color:#fff}
.pill.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pace{position:relative;height:8px;background:var(--sunk);border-radius:4px;min-width:90px;overflow:visible}
.pace i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.pace i.exc{background:var(--red)}
.pace b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
details>summary{cursor:pointer;color:var(--ink-2);font-size:.82rem;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ "}
details[open]>summary::before{content:"– "}
.list{display:grid}
.li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main{min-width:0;flex:1}
.li .main p{overflow-wrap:anywhere}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--r)}
.note{font-size:.82rem;color:var(--ink-2);border-left:2px solid var(--line-2);padding-left:10px}
.steps{display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--f-display);font-weight:800;font-size:1.2rem;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);color:var(--ink-3)}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.now .n{border-color:var(--accent);color:var(--accent)}
.step.now{background:linear-gradient(90deg,var(--accent-soft),transparent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:74px;padding:4px 5px;font-size:.72rem;min-width:0;overflow:hidden}
.cal .h{min-height:auto;text-align:center;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;background:var(--sunk)}
.cal .d{font-family:var(--f-num);color:var(--ink-3)}
.cal .today .d{color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:0 4px}
.cal .ev{display:block;margin-top:2px;padding:1px 4px;border-radius:3px;background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cal .ev.lim{background:var(--accent);color:var(--accent-ink)}
.cal .out{background:var(--sunk);opacity:.5}
svg text{fill:var(--ink-3);font-family:var(--f-num);font-size:11px}
.chat{display:grid;grid-template-rows:auto 1fr auto;min-height:560px}
.msgs{display:grid;gap:14px;align-content:start;padding:6px 0 16px;max-height:62vh;overflow-y:auto}
.msg{max-width:min(720px,100%);min-width:0}
.msg.u{justify-self:end;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:12px 12px 2px 12px}
.msg.a{background:var(--sunk);padding:12px 16px;border-radius:12px 12px 12px 2px}
.msg.a h1,.msg.a h2,.msg.a h3,.msg.a h4{font-size:1rem;margin:10px 0 4px}
.msg.a p{margin:6px 0}
.msg.a ul,.msg.a ol{margin:6px 0;padding-left:20px}
.msg.a code{font-family:var(--f-num);font-size:.86em}
.msg .tools{font-size:.75rem;color:var(--ink-3);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--surface);color:var(--ink);border-color:var(--line-2);font-weight:500;font-size:.82rem;border-radius:99px;padding:6px 12px}
.composer{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.composer textarea{min-height:46px;max-height:180px}
.verdict{font-family:var(--f-display);font-weight:750;font-size:1.05rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:.88rem;z-index:20}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;padding:4px 0}
.chk input{width:auto;margin-top:3px}
.status{font-size:.78rem;color:var(--ink-3);display:inline-flex;gap:6px;align-items:center}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.status.live::before{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
.theme-switch{display:inline-flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--ink-2);padding:6px 4px;font-weight:500}
.theme-switch .track{width:40px;height:22px;border-radius:11px;background:var(--line-2);position:relative;transition:background .2s}
.theme-switch .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.theme-switch[aria-checked="true"] .track{background:var(--accent)}
.theme-switch[aria-checked="true"] .knob{transform:translateX(18px);background:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.theme-switch .track,.theme-switch .knob{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Asesor <span>Financiero</span></h1>
      <small>Dany · MXN · Estado de México</small>
    </div>
    <div class="toolbar">
      <label class="f" style="width:150px">Mes
        <input type="month" id="mesSel">
      </label>
      <span class="status" id="storeStatus">Cargando…</span>
      <button type="button" class="theme-switch" id="themeSw" role="switch" aria-checked="false" aria-label="Modo oscuro"><span class="track"><span class="knob"></span></span><span id="themeLbl">Claro</span></button>
      <button class="ghost" id="btnMenu" aria-expanded="false">Respaldo</button>
    </div>
  </header>
  <div class="panel" id="menuPanel" hidden style="margin-bottom:18px">
    <div class="row">
      <button class="ghost" data-a="exportar">Descargar respaldo (.json)</button>
      <label class="btn ghost" style="background:transparent;color:var(--ink);border-color:var(--line-2)">Restaurar respaldo<input type="file" id="fileRestore" accept="application/json" hidden></label>
      <button class="ghost" data-a="copiarContexto">Copiar contexto para la skill</button>
    </div>
    <p class="note" style="margin-top:10px">“Copiar contexto” arma un resumen compacto de tus números para pegarlo en un chat con la skill del asesor, que sí puede verificar en internet.</p>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const NF2=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>NF.format(Math.round(n||0));
const money2=n=>NF2.format(n||0);
const pct=n=>(isFinite(n)?Math.round(n*100):0)+'%';
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const ymOf=f=>f.slice(0,7);
const curYM=()=>today().slice(0,7);
const dim=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const addMonths=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${y}-${pad(m)}`};
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ymLabel=ym=>{const[y,m]=ym.split('-');return `${MESES[+m-1]} ${y.slice(2)}`};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const fechaCorta=f=>{const[y,m,d]=f.split('-');return `${+d} ${MESES[+m-1]}`};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(w=>w.length>1).slice(0,3).join(' ');
const maskCards=s=>String(s||'').replace(/\b(?:\d[ -]?){12,19}\b/g,m=>'••••'+m.replace(/\D/g,'').slice(-4));
const hashMov=m=>`${m.fecha}|${(+m.monto).toFixed(2)}|${norm(m.desc)}`;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2400)}

/* ================= datos de ejemplo ================= */
function seed(){
  const cm=curYM();
  const cats=[['comida','Comida y súper',3500],['salidas','Restaurantes y salidas',1800],['transporte','Transporte',1200],['subs','Suscripciones',450],['dj','Equipo DJ y música',1000],['hogar','Aporte a casa',2000],['salud','Salud y ejercicio',700],['personal','Ropa y personal',600],['educ','Cursos y libros',800]]
    .map(([id,nombre,presupuesto])=>({id,nombre,presupuesto}));
  const cuentas=[
    {id:'deb',nombre:'Débito nómina',tipo:'debito',ultimos4:'4821',dia_corte:'',dia_limite_pago:'',saldo_actual:8400},
    {id:'tdc',nombre:'Tarjeta de crédito',tipo:'credito',ultimos4:'0937',dia_corte:5,dia_limite_pago:25,saldo_actual:-3200},
    {id:'efe',nombre:'Efectivo',tipo:'efectivo',ultimos4:'',dia_corte:'',dia_limite_pago:'',saldo_actual:900},
    {id:'aho',nombre:'Ahorro',tipo:'ahorro',ultimos4:'',dia_corte:'',dia_limite_pago:'',saldo_actual:14500}];
  let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const plantillas=[['comida','Walmart súper',[380,820],5,'deb'],['comida','Oxxo',[60,140],5,'efe'],['salidas','Tacos y cervezas',[180,420],4,'tdc'],['salidas','Cine Cinépolis',[160,260],1,'tdc'],
    ['transporte','Uber',[70,190],5,'tdc'],['transporte','Gasolina',[300,500],1,'deb'],['subs','Spotify',[129,129],1,'tdc'],['subs','Netflix',[219,219],1,'tdc'],
    ['dj','Beatport tracks',[150,420],2,'tdc'],['hogar','Aporte a casa',[2000,2000],1,'deb'],['salud','Proteína',[550,650],1,'deb'],['personal','Liverpool',[300,900],1,'tdc'],['educ','Libro Amazon',[240,380],1,'tdc']];
  const movs=[];
  for(let k=-5;k<=0;k++){
    const ym=addMonths(cm,k);const maxDay=k===0?Math.max(1,+today().slice(8)):dim(ym);
    const f=d=>`${ym}-${pad(Math.min(d,maxDay))}`;
    movs.push({id:uid(),cuenta:'deb',fecha:f(1),desc:'Pago quincena prácticas (ejemplo)',comercio:'Prácticas',monto:3000,tipo:'ingreso',cat:'',revisar:false});
    if(maxDay>=15)movs.push({id:uid(),cuenta:'deb',fecha:f(15),desc:'Pago quincena prácticas (ejemplo)',comercio:'Prácticas',monto:3000,tipo:'ingreso',cat:'',revisar:false});
    movs.push({id:uid(),cuenta:'efe',fecha:f(10),desc:'Turnos ludoteca-bar (ejemplo)',comercio:'Ludoteca bar',monto:2400+Math.round(rnd()*1200),tipo:'ingreso',cat:'',revisar:false});
    if(rnd()>.4)movs.push({id:uid(),cuenta:'deb',fecha:f(20),desc:'Gig DJ evento privado (ejemplo)',comercio:'Gig DJ',monto:1500+Math.round(rnd()*2000),tipo:'ingreso',cat:'',revisar:false});
    for(const[cat,desc,[a,b],veces,cta]of plantillas){
      const n=k===0?Math.max(1,Math.round(veces*maxDay/dim(ym))):veces+(rnd()>.6?1:0);
      for(let i=0;i<n;i++){const d=1+Math.floor(rnd()*maxDay);
        movs.push({id:uid(),cuenta:cta,fecha:f(d),desc,comercio:desc,monto:Math.round(a+rnd()*(b-a)),tipo:'gasto',cat,revisar:false});}
    }
  }
  // un par sin categoría para la bandeja
  movs.push({id:uid(),cuenta:'tdc',fecha:today(),desc:'MERPAGO*TIENDAXYZ',comercio:'MERPAGO TIENDAXYZ',monto:349,tipo:'gasto',cat:'',revisar:true});
  movs.push({id:uid(),cuenta:'tdc',fecha:today(),desc:'STR*SUPERSONICA AUDIO',comercio:'Supersonica audio',monto:780,tipo:'gasto',cat:'dj',revisar:true});
  movs.forEach(m=>m.hash=hashMov(m));
  const prox=(day)=>{const t=today();let ym=curYM();if(+t.slice(8)>day)ym=addMonths(ym,1);return `${ym}-${pad(Math.min(day,dim(ym)))}`};
  return {
    meta:{demo:true,v:1},
    cuentas,categorias:cats,movs,

const movsMes=ym=>S.movs.filter(m=>m.fecha.startsWith(ym));
const sum=(a,f=x=>x.monto)=>a.reduce((s,x)=>s+(+f(x)||0),0);
function totalesMes(ym){const ms=movsMes(ym);return{ing:sum(ms.filter(m=>m.tipo==='ingreso')),gas:sum(ms.filter(m=>m.tipo==='gasto'))}}
function avgUlt3(tipo){let t=0;for(let k=1;k<=3;k++)t+=totalesMes(addMonths(curYM(),-k))[tipo];return t/3}
function recurrentes(){
  const by={};for(const m of S.movs.filter(m=>m.tipo==='gasto')){const k=norm(m.comercio||m.desc);(by[k]=by[k]||[]).push(m)}
  const set=new Set();
  for(const[k,arr]of Object.entries(by)){const meses=new Set(arr.map(m=>ymOf(m.fecha)));if(meses.size<2)continue;
    const mins=Math.min(...arr.map(m=>m.monto)),maxs=Math.max(...arr.map(m=>m.monto));if(maxs<=mins*1.15&&arr.length<=meses.size+1)set.add(k)}
  return set;
}
function presupuesto(ym){
  const ms=movsMes(ym).filter(m=>m.tipo==='gasto');
  const elapsed=ym===curYM()?(+today().slice(8))/dim(ym):(ym<curYM()?1:0);
  const rows=S.categorias.map(c=>{
    const mm=ms.filter(m=>m.cat===c.id);const g=sum(mm);const p=+c.presupuesto||0;
    const pg=p?g/p:0;const ritmo=(pg-elapsed)*100;
    const estado=p&&g>p?'excedido':(p&&ritmo>20?'riesgo':'ok');
    return{id:c.id,nombre:c.nombre,g,p,dif:p-g,pg,elapsed,estado,proy:elapsed>0?g/elapsed:g,top:[...mm].sort((a,b)=>b.monto-a.monto).slice(0,3)};
  });
  const sin=ms.filter(m=>!m.cat);
  if(sin.length)rows.push({id:'',nombre:'Sin categoría',g:sum(sin),p:0,dif:-sum(sin),pg:0,elapsed,estado:'ok',proy:sum(sin),top:sin.slice(0,3)});
  const sinRow=rows[rows.length-1]?.id===''&&sin.length?rows.pop():null;rows.sort((a,b)=>(b.g-b.p)-(a.g-a.p));if(sinRow)rows.push(sinRow);return rows;
}
function proximasFechas(dias){
  const t=today(),out=[];
  for(const p of S.pagos){let f=p.proximo;if(!f)continue;const d=daysBetween(t,f);if(d>=-3&&d<=dias)out.push({tipo:'pago',f,d,nombre:p.nombre,monto:+p.monto,cuenta:p.cuenta,ref:p})}
  for(const c of S.cuentas.filter(c=>c.tipo==='credito'&&c.dia_limite_pago)){
    for(const k of[0,1]){const ym=addMonths(curYM(),k);const f=`${ym}-${pad(Math.min(+c.dia_limite_pago,dim(ym)))}`;const d=daysBetween(t,f);
      if(d>=0&&d<=dias){out.push({tipo:'tdc',f,d,nombre:'Pago '+c.nombre,monto:Math.max(0,-(+c.saldo_actual)),cuenta:'',ref:c});break}}
  }
  return out.sort((a,b)=>a.d-b.d);
}
function alcanza(e){
  if(e.tipo==='tdc'){const deb=sum(S.cuentas.filter(c=>c.tipo==='debito'),c=>c.saldo_actual);return{ok:deb>=e.monto,txt:deb>=e.monto?'Tu débito alcanza':'Tu débito no alcanza'}}
  const c=S.cuentas.find(c=>c.id===e.cuenta);if(!c)return{ok:true,txt:''};
  if(c.tipo==='credito')return{ok:true,txt:'Se carga a '+c.nombre};
  return{ok:+c.saldo_actual>=e.monto,txt:+c.saldo_actual>=e.monto?'El saldo alcanza':'Saldo insuficiente en '+c.nombre};
}
function diagnostico(){
  const P=S.plan;
  const ingPlan=sum(P.ingresos||[]);const ing=ingPlan||avgUlt3('ing');
  const gasMov=avgUlt3('gas');const gas=gasMov||+P.gastoFijo||0;
  const esencial=+P.gastoFijo||gas;
  const varShare=ingPlan?sum(P.ingresos.filter(i=>i.tipo==='variable'))/ingPlan:0;
  const mesesObj=varShare>.3?6:3;
  const liquido=sum(S.cuentas.filter(c=>c.tipo==='ahorro'),c=>c.saldo_actual);
  const meses=esencial?liquido/esencial:0;
  const caras=(P.deudas||[]).filter(d=>+d.tasa>=20&&+d.saldo>0);
  const tasaAhorro=ing?(ing-gas)/ing:0;
  const fondoObj=mesesObj*esencial;
  const pagos30=sum(proximasFechas(30),e=>e.monto);
  const invertible=Math.max(0,liquido-fondoObj-sum(caras,d=>d.saldo)-pagos30);
  const steps=[
    {t:'Flujo positivo',d:'Ganas más de lo que gastas cada mes.',ok:ing>gas,v:`${money(ing)} ingresos vs ${money(gas)} gastos`},
    {t:'Colchón de un mes',d:'Un mes de gastos esenciales en ahorro líquido.',ok:meses>=1,v:`${meses.toFixed(1)} meses cubiertos`},
    {t:'Sin deudas caras',d:'Liquidar deudas con tasa anual de 20% o más antes de invertir.',ok:caras.length===0,v:caras.length?`${money(sum(caras,d=>d.saldo))} pendientes`:'Ninguna'},
    {t:'Fondo de emergencia completo',d:`${mesesObj} meses de gastos esenciales${mesesObj===6?' (tu ingreso es variable en más de 30%)':''}.`,ok:meses>=mesesObj,v:`${money(liquido)} de ${money(fondoObj)}`},
    {t:'Invertir para el largo plazo',d:'Destinar al menos 15% del ingreso a ahorro e inversión de largo plazo.',ok:tasaAhorro>=.15,v:`Tasa de ahorro ${pct(tasaAhorro)}`},
    {t:'Especulación acotada',d:'Trading y apuestas de alto riesgo con máximo 5% del capital invertible.',ok:null,v:`Tope hoy: ${money(invertible*.05)}`}];
  const actual=steps.findIndex(s=>s.ok===false);
  return{ing,gas,esencial,varShare,mesesObj,liquido,meses,caras,tasaAhorro,fondoObj,pagos30,invertible,steps,actual:actual<0?5:actual};
}

function evalIdea(i){
  const mc=(+i.precio)-(+i.costo)-(+i.cac);const fij=+i.fijos||0;
  const esc=(i.u||[0,0,0]).map(u=>u*mc-fij);
  const be=mc>0?fij/mc:Infinity;const pay=esc[1]>0?(+i.inversion||0)/esc[1]:Infinity;
  const roi=i.inversion?(esc[1]*12-i.inversion)/i.inversion:0;
  const val=Object.values(i.check||{}).filter(Boolean).length;
  let v;
  if(mc<=0)v='No recomendada';
  else if(esc[1]<=0)v='Prometedora pero requiere ajustes';
  else if(val<2)v='Demasiado riesgosa con la información disponible';
  else if(pay<=6&&esc[0]>0)v='Oportunidad sólida';
  else if(pay>18)v='Poco atractiva financieramente';
  else v='Vale la pena investigar';
  return{mc,mcp:i.precio?mc/i.precio:0,esc,be,pay,roi,val,v};
}

function lectura(D,rows,ing,gas){

  const r=rows.find(r=>r.estado==='riesgo');if(r)out.push({t:`${r.nombre} va rápido`,d:`Llevas ${pct(r.pg)} del presupuesto con ${pct(r.elapsed)} del mes. Al ritmo actual cerraría en ${money(r.proy)}.`,pill:'<span class="pill risk">En riesgo</span>'});
  out.push({t:`Paso actual de tu plan: ${D.steps[D.actual].t}`,d:D.steps[D.actual].d+' '+D.steps[D.actual].v+'.',pill:'<a class="pill solid" href="#plan" style="text-decoration:none">Ver plan</a>'});
  if(D.caras.length)out.push({t:'Deuda cara activa',d:`Pagar una deuda al ${D.caras[0].tasa}% anual es un rendimiento garantizado que ninguna inversión normal iguala.`,pill:'<span class="pill risk">Atención</span>'});
  return out.slice(0,4);

function chartBars(rows){

function parseCSV(txt){
  const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur.trim());cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur.trim());cur='';if(row.some(x=>x))rows.push(row);row=[]}
    else cur+=ch}
  row.push(cur.trim());if(row.some(x=>x))rows.push(row);return rows;
}
function guessMap(head){
  return head.map(h=>{const n=norm(h);
    if(/fecha|date|dia/.test(n))return'fecha';if(/descrip|concepto|detalle|comercio|referencia/.test(n))return'descripcion';
    if(/cargo|retiro|debito/.test(n))return'cargo';if(/abono|deposito|credito/.test(n))return'abono';if(/monto|importe|cantidad|amount/.test(n))return'monto';return''});
}
function parseFecha(s){
  s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}
  const mes=s.toLowerCase().match(/(\d{1,2})[\s\/-]*([a-z]{3})[a-z]*[\s\/-]*(\d{2,4})/);if(mes){const i=MESES.indexOf(mes[2]);if(i>=0){const y=mes[3].length===2?'20'+mes[3]:mes[3];return `${y}-${pad(i+1)}-${pad(mes[1])}`}}
  return null;
}
const parseNum=s=>{s=String(s||'').replace(/[$\s]/g,'');if(!s)return NaN;const neg=/^\(.*\)$/.test(s)||s.startsWith('-');s=s.replace(/[()\-]/g,'');if(/,\d{2}$/.test(s)&&!/\.\d{2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);return neg?-n:n};
function aplicarReglas(m){
  if(m.tipo!=='gasto'||m.cat)return m;const k=norm(m.comercio||m.desc);
  const r=S.reglas.find(r=>k.includes(r.patron)||r.patron.includes(k));if(r){m.cat=r.cat;m.revisar=false}else m.revisar=true;return m;
}
function agregarMovs(arr){
  const hs=new Set(S.movs.map(m=>m.hash));let n=0,dup=0;
  for(const m of arr){m.desc=maskCards(m.desc);m.comercio=m.comercio||m.desc;m.hash=hashMov(m);if(hs.has(m.hash)){dup++;continue}hs.add(m.hash);S.movs.push(aplicarReglas(m));n++}
  return{n,dup};
}
function interpretarLocal(t){
  const out={fecha:today()};const num=t.match(/\d[\d,]*(?:\.\d+)?/);out.monto=num?parseNum(num[0]):'';
  const l=norm(t.replace(/\d/g,' '))+' '+t.toLowerCase();
  out.tipo=/(me pagaron|cobr|gig|ingres|sueldo|nomina|quincena|deposit)/.test(l)?'ingreso':'gasto';
  const tipoMap=[[/debito|débito/,'debito'],[/credito|crédito|tarjeta|tdc/,'credito'],[/efectivo|cash/,'efectivo'],[/ahorro/,'ahorro']];
  let cta=S.cuentas.find(c=>l.includes(norm(c.nombre)));if(!cta)for(const[re,tp]of tipoMap)if(re.test(l)){cta=S.cuentas.find(c=>c.tipo===tp);if(cta)break}
  out.cuenta=cta?.id||S.cuentas[0]?.id;
  let desc=t.replace(/\d[\d,]*(?:\.\d+)?/,'').replace(/\b(con|en|de|del|pesos|mxn)\b/gi,' ').replace(/(débito|debito|crédito|credito|tarjeta|tdc|efectivo)/gi,'').replace(/\s+/g,' ').trim();
  out.desc=desc?desc[0].toUpperCase()+desc.slice(1):'Movimiento';
  const tmp=aplicarReglas({tipo:out.tipo,desc:out.desc,comercio:out.desc,cat:''});
  const kw={comida:/super|súper|oxxo|walmart|soriana|mercado|despensa/,salidas:/taco|bar|restaurant|cerve|cafe|café|cine/,transporte:/uber|didi|metro|gasolina|taxi|camion/,subs:/spotify|netflix|suscrip|prime|disney/,dj:/beatport|dj|cable|audio|bocina|controlador/,salud:/gym|proteina|farmacia|doctor/,educ:/curso|libro|udemy/};
  const k=Object.entries(kw).find(([id,re])=>re.test(l)&&S.categorias.some(c=>c.id===id));
  out.cat=tmp.cat||(k?k[0]:'');return out;
}

function calcMeta(g){
  const falta=Math.max(0,g.objetivo-g.actual);const meses=Math.max(.5,daysBetween(today(),g.fecha)/30.44);
  const porMes=falta/meses;const desde=addMonths(curYM(),-2)+'-01';
  const ritmo=sum((g.aportes||[]).filter(a=>a.fecha>=desde))/3;
  const need=ritmo>0?falta/ritmo:Infinity;const retraso=Math.ceil(need-meses);
  return{falta,meses,porMes,porQ:porMes/2,ritmo,need,retraso,av:g.objetivo?g.actual/g.objetivo:0};
}

/* ================= vistas: Inversiones ================= */
const CHECK11=['Qué hace la empresa','Salud financiera','Ventajas competitivas','Valuación actual','Oportunidades de crecimiento','Riesgos principales','Desempeño reciente','Perspectivas','¿El precio actual es atractivo?','Horizonte de inversión','Encaje en mi portafolio'];
function vInversiones(){
  const D=diagnostico();const w=S.watch.find(x=>x.id===UI.watchSel)||S.watch[0];
  const T=UI.calc||{capital:'',riesgo:1,entrada:'',stop:'',objetivo:''};
  const rps=Math.abs(T.entrada-T.stop);const riesgoMx=T.capital*T.riesgo/100;const acc=rps>0?Math.floor(riesgoMx/rps):0;
  const rr=rps>0&&T.objetivo?Math.abs(T.objetivo-T.entrada)/rps:0;const valor=acc*T.entrada;
  const warns=[];
  if(T.capital){if(D.actual<4)warns.push(`Tu plan está en el peldaño ${D.actual+1} (${D.steps[D.actual].t.toLowerCase()}). Operar con dinero real va después de completar el fondo de emergencia.`);
    if(+T.capital>D.invertible*.05)warns.push(`Tu capital de trading supera el 5% de tu dinero invertible (${money(D.invertible*.05)}).`);
    if(rr&&rr<2)warns.push('La relación riesgo/beneficio es menor a 2:1.');if(valor>T.capital)warns.push('La posición excede tu capital de trading: implicaría apalancamiento.');if(T.riesgo>2)warns.push('Arriesgar más de 2% por operación acelera las rachas de pérdidas.')}
  const tr=S.trades.map(t=>{const dir=t.lado==='corto'?-1:1;const pl=(t.salida-t.entrada)*t.tam*dir;const r1=Math.abs(t.entrada-t.stop)*t.tam;return{...t,pl,R:r1?pl/r1:0}});
  const cer=tr.filter(t=>t.salida);const wins=cer.filter(t=>t.pl>0).length;
  return `
  <div class="banner"><p class="small">Aquí registras tu análisis y disciplina. Este tablero no consulta precios en vivo: para datos actuales, noticias o reportes, usa la skill del asesor, que verifica en internet con fecha y fuente.</p></div>
  <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)">
    <div class="panel"><div class="panel-h"><h2>Lista de seguimiento</h2></div>
      <div class="list">${S.watch.map(x=>`<div class="li" style="cursor:pointer" data-a="selWatch" data-id="${x.id}"><div class="main"><p><strong>${esc(x.ticker)}</strong> <span class="pill">${x.horizonte}</span></p><p class="small muted">${esc(x.nombre)} · ${x.check.filter(Boolean).length}/11 · ${esc(x.veredicto||'Sin veredicto')}</p></div></div>`).join('')||'<p class="small faint">Vacía.</p>'}</div>
      <form id="watchForm" class="form" style="margin-top:12px;grid-template-columns:1fr 1fr"><label class="f">Ticker<input id="wt_t" required></label><label class="f">Horizonte<select id="wt_h"><option value="largo">Largo</option><option value="medio">Medio</option><option value="corto">Corto</option></select></label><label class="f" style="grid-column:1/-1">Nombre<input id="wt_n"></label><button type="submit" class="ghost">Agregar</button></form></div>
    <div class="panel">${w?`
      <div class="panel-h"><div><h2>${esc(w.ticker)}</h2><p class="small muted">${esc(w.nombre)}</p></div><button class="link" data-a="borrarWatch" data-id="${w.id}">Quitar</button></div>
      <label class="f">Tesis en tus palabras<textarea data-watch="tesis">${esc(w.tesis)}</textarea></label>
      <div class="grid2" style="margin-top:12px;gap:12px">
        <label class="chk"><input type="checkbox" data-watchb="granEmpresa" ${w.granEmpresa?'checked':''}> Es una gran empresa</label>
        <label class="chk"><input type="checkbox" data-watchb="buenPrecio" ${w.buenPrecio?'checked':''}> Es una buena inversión a su precio actual</label>
      </div>
      ${w.granEmpresa&&!w.buenPrecio?'<p class="note">Gran empresa no es lo mismo que gran inversión: el precio que pagas decide tu rendimiento.</p>':''}
      <h3 style="margin-top:14px">Evaluación de 11 puntos</h3>
      <div style="columns:2 220px">${CHECK11.map((c,k)=>`<label class="chk"><input type="checkbox" data-watchc="${k}" ${w.check[k]?'checked':''}> ${c}</label>`).join('')}</div>
      <div class="form" style="margin-top:12px">
        <label class="f">Precio que registraste<input type="number" step="any" data-watch="precioRef" value="${w.precioRef}"></label>
        <label class="f">Fecha de ese precio<input type="date" data-watch="fechaRef" value="${w.fechaRef}"></label>
        <label class="f">Precio que me parecería atractivo<input type="number" step="any" data-watch="precioAtractivo" value="${w.precioAtractivo}"></label>
        <label class="f">Veredicto<select data-watch="veredicto">${['Sin veredicto','Oportunidad sólida','Vale la pena investigar','Prometedora pero requiere ajustes','Sobrevalorada o poco atractiva','Demasiado riesgosa con la información disponible','No recomendada'].map(v=>`<option ${w.veredicto===v?'selected':''}>${v}</option>`).join('')}</select></label>
      </div>
      ${w.fechaRef&&daysBetween(w.fechaRef,today())>7?`<p class="note" style="margin-top:8px">Ese precio tiene ${daysBetween(w.fechaRef,today())} días. No lo uses como dato actual.</p>`:''}
      <div class="row" style="margin-top:12px"><button class="ghost" data-a="preguntar" data-q="${esc(`Revisa mi ficha de ${w.ticker}: ¿qué le falta a mi tesis y qué preguntas debería responder antes de decidir? Recuerda que no tienes precios actuales aquí.`)}">Revisar mi tesis con el asesor</button></div>
    `:'<div class="empty">Agrega una empresa o ETF para documentar tu tesis.</div>'}</div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h2>Calculadora de posición</h2><span class="small faint">Primero el riesgo, después la ganancia</span></div>
      <form id="calcForm" class="form">

        <label class="f">Entrada<input type="number" step="any" id="tc_e" value="${T.entrada}"></label>
        <label class="f">Stop (invalidación)<input type="number" step="any" id="tc_s" value="${T.stop}"></label>

const RULES=`Eres el asesor financiero personal de Daniel (Dany), dentro de su tablero "Asesor Financiero". Respondes SIEMPRE en español.

QUIÉN ERES: Asesor financiero, estratega de inversión e inversionista de negocios con la disciplina de Warren Buffett y Charlie Munger: racional, paciente, escéptico del hype, enfocado en fundamentos, interés compuesto y preservación de capital. Hablas como un inversionista experimentado que no necesita impresionar: sin jerga innecesaria, con ejemplos simples y cuentas concretas. Tu trabajo es que Daniel piense mejor sobre el dinero, no solo darle respuestas.

QUIÉN ES DANIEL: Mexicano en el Estado de México. Prácticas en marketing en Planet Fitness México, trabajo de medio tiempo en una ludoteca-bar, DJ con gigs ocasionales. Estudió Sports and Events Management (dos años en Hamburgo). Le interesan el emprendimiento, la música, los eventos y crear ingresos adicionales; su meta de largo plazo es la independencia financiera. Considera el contexto mexicano cuando aplique (inflación, ISR, CETES, BMV/BIVA, exposición MXN/USD/EUR).

DATOS: Tienes herramientas para leer los datos reales del tablero (resumen, movimientos, presupuesto, metas, pagos, plan, negocios, inversiones). Úsalas antes de opinar sobre su situación y cita los números que usaste. Nunca inventes cifras. Si el tablero muestra datos de ejemplo (demo=true), dilo. No tienes acceso a internet: no conoces precios, tasas ni noticias actuales. Si la pregunta los necesita, dilo claramente y sugiere usar la skill "asesor-financiero" en el chat de Claude, que sí verifica en internet. Nunca presentes un precio o tasa de memoria como actual.

MARCO DE DECISIÓN para evaluaciones: A) Situación, B) Análisis financiero, C) Riesgos, D) Alternativas, E) Veredicto (Oportunidad sólida / Vale la pena investigar / Prometedora pero requiere ajustes / Sobrevalorada o poco atractiva / Demasiado riesgosa con la información disponible / No recomendada), F) Plan de acción. Si la información no alcanza, no fuerces un veredicto: di qué falta.

REGLAS: No le des la razón solo para apoyarlo; si algo es irresponsable, persigue hype o confunde especulación con inversión, díselo con respeto. Nunca garantices rendimientos ni confundas rendimiento pasado con futuro. El dinero en la cuenta no es automáticamente dinero invertible: respeta el orden flujo positivo → colchón → deudas caras → fondo de emergencia → inversión de largo plazo → especulación acotada (máx. 5%). Nunca sugieras hacer trading con dinero de gastos esenciales, deudas o fondo de emergencia. En trading explica siempre el escenario bajista, la invalidación y la posibilidad de perder. Tu análisis de inversiones es educativo: no eres un asesor certificado y la decisión es de Daniel; recomiéndale un profesional (contador, asesor certificado) cuando el tema lo amerite. Detecta posibles fraudes o promesas de dinero fácil.

FORMATO: Directo y conciso para decisiones simples; más detalle solo cuando el análisis lo pide. Usa Markdown ligero (negritas, listas cortas). Montos en MXN con separador de miles.`;

function md(s){
  let h=esc(s);
  h=h.replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/^# (.*)$/gm,'<h3>$1</h3>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/(^|\n)((?:\s*[-*] .*(?:\n|$))+)/g,(m,p,b)=>p+'<ul>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^\s*[-*] /,'')+'</li>').join('')+'</ul>');
  h=h.replace(/(^|\n)((?:\s*\d+[.)] .*(?:\n|$))+)/g,(m,p,b)=>p+'<ol>'+b.trim().split('\n').map(l=>'<li>'+l.replace(/^\s*\d+[.)] /,'')+'</li>').join('')+'</ol>');
  return h.split(/\n{2,}/).map(b=>/^<(h\d|ul|ol)/.test(b.trim())?b:'<p>'+b.replace(/\n/g,'<br>')+'</p>').join('');
}

      if(p.frecuencia==='unica')S.pagos=S.pagos.filter(x=>x.id!==id);else{const k=p.frecuencia==='anual'?12:1;const nm=addMonths(ymOf(p.proximo),k);p.proximo=`${nm}-${pad(Math.min(+p.proximo.slice(8),dim(nm)))}`}
      commit('Pago registrado y saldo actualizado')},
    borrarPago(){S.pagos=S.pagos.filter(p=>p.id!==id);commit()},
    borrarCta(){if(S.movs.some(m=>m.cuenta===id)){toast('Esa cuenta tiene movimientos; ajusta su saldo a 0 en lugar de quitarla');return}S.cuentas=S.cuentas.filter(c=>c.id!==id);commit()},
    borrarIng(){S.plan.ingresos.splice(+b.dataset.i,1);commit()},borrarDeuda(){S.plan.deudas.splice(+b.dataset.i,1);commit()},
    borrarDec(){S.decisiones=S.decisiones.filter(d=>d.id!==id);commit()},
    registrarExtra(){const am=UI.asig;if(!am?.monto)return;agregarMovs([{id:uid(),cuenta:S.cuentas[0]?.id,fecha:today(),desc:am.fuente,comercio:am.fuente,monto:+am.monto,tipo:'ingreso',cat:'',revisar:false}]);UI.asig=null;commit('Ingreso registrado')},
    selIdea(){UI.ideaSel=id;render()},borrarIdea(){S.ideas=S.ideas.filter(i=>i.id!==id);UI.ideaSel=null;commit()},
    selWatch(){UI.watchSel=id;render()},borrarWatch(){S.watch=S.watch.filter(w=>w.id!==id);UI.watchSel=null;commit()},
    async exportar(){const dl=await (async()=>{try{return window.claude?.use?await window.claude.use('downloads'):null}catch(e){return null}})();
      if(!dl){toast('Las descargas solo funcionan dentro de Claude');return}
      try{await dl.save({filename:`asesor-financiero-${today()}.json`,data:JSON.stringify(S,null,1)});toast('Respaldo listo')}catch(e){toast('No se descargó el respaldo')}},
    async copiarContexto(){
      const ctx={generado:today(),...snapshotResumen(curYM()),metas:TOOLS[2].execute(),pagos_30d:TOOLS[3].execute().proximos,plan:TOOLS[4].execute(),ideas:TOOLS[5].execute().map(i=>({nombre:i.nombre,lectura:i.lectura_preliminar,margen:i.margen_por_venta})),seguimiento:S.watch.map(w=>({ticker:w.ticker,horizonte:w.horizonte,veredicto:w.veredicto}))};
      const txt='Contexto de mi tablero Asesor Financiero:\n'+JSON.stringify(ctx);
      try{await navigator.clipboard.writeText(txt);toast('Contexto copiado: pégalo en el chat con la skill')}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='width:100%;height:120px;margin-top:10px';$('#menuPanel').append(ta);ta.select();toast('Selecciona y copia el texto')}
    }
  };
  if(A[a]){ev.preventDefault();A[a]()}
});
function setCat(m,cat){
  m.cat=cat;m.revisar=false;const k=norm(m.comercio||m.desc);
  if(cat&&k){const r=S.reglas.find(r=>r.patron===k);if(r)r.cat=cat;else S.reglas.push({patron:k,cat});
    S.movs.forEach(x=>{if(x.tipo==='gasto'&&!x.cat&&norm(x.comercio||x.desc)===k){x.cat=cat;x.revisar=false}})}
  commit('Categoría guardada y regla aprendida');
}
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='mesSel'&&t.value){MES=t.value;render();return}
  if(t.id==='csvFile'&&t.files[0]){const f=t.files[0];const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(String(rd.result));let hi=rows.findIndex(r=>guessMap(r).filter(Boolean).length>=2);if(hi<0)hi=0;
    const head=rows[hi]||[];UI.csv={nombre:f.name,head,rows:rows.slice(hi+1).filter(r=>r.length>=2),map:guessMap(head)};render()};rd.readAsText(f,'utf-8');return}
  if(t.id==='fileRestore'&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.movs))throw 0;S={...emptyState(),...d};commit('Respaldo restaurado')}catch(e){toast('Ese archivo no es un respaldo válido')}};rd.readAsText(t.files[0]);return}
  if(t.dataset.map!=null){UI.csv.map[+t.dataset.map]=t.value;return}
  if(t.dataset.rev){const m=S.movs.find(m=>m.id===t.dataset.rev);if(m&&t.value)setCat(m,t.value);return}
  if(t.dataset.saldo){const c=S.cuentas.find(c=>c.id===t.dataset.saldo);c.saldo_actual=+t.value||0;commit('Saldo actualizado');return}
  if(t.dataset.plan){const k=t.dataset.plan.split('.');let o=S.plan;while(k.length>1){const p=k.shift();o=o[p]=o[p]||{}}o[k[0]]=t.type==='number'?(+t.value||0):t.value;commit();return}
  if(t.dataset.res){const d=S.decisiones.find(d=>d.id===t.dataset.res);d.resultado=t.value;commit();return}
  const idea=S.ideas.find(x=>x.id===(UI.ideaSel||S.ideas[0]?.id));
  if(t.dataset.idea&&idea){idea[t.dataset.idea]=+t.value||0;commit();return}
  if(t.dataset.ideau&&idea){idea.u[+t.dataset.ideau]=+t.value||0;commit();return}
  if(t.dataset.ideach&&idea){idea.check=idea.check||{};idea.check[t.dataset.ideach]=t.checked;commit();return}
  const w=S.watch.find(x=>x.id===UI.watchSel)||S.watch[0];
  if(t.dataset.watch&&w){w[t.dataset.watch]=t.value;commit();return}
  if(t.dataset.watchb&&w){w[t.dataset.watchb]=t.checked;commit();return}
  if(t.dataset.watchc&&w){w.check[+t.dataset.watchc]=t.checked;commit();return}
});
document.addEventListener('submit',ev=>{
  const f=ev.target;ev.preventDefault();const v=id=>f.querySelector('#'+id)?.value?.trim()??'';
  const F={
    movForm(){const monto=+v('mf_monto');if(!monto)return toast('Escribe un monto');const tipo=v('mf_tipo');
      const r=agregarMovs([{id:uid(),cuenta:v('mf_cta'),fecha:v('mf_fecha'),desc:v('mf_desc'),comercio:v('mf_desc'),monto,tipo,cat:tipo==='gasto'?v('mf_cat'):'',revisar:false}]);
      const m=S.movs[S.movs.length-1];if(r.n&&m.cat){m.revisar=false;const k=norm(m.desc);if(k&&!S.reglas.some(x=>x.patron===k))S.reglas.push({patron:k,cat:m.cat})}
      const c=S.cuentas.find(c=>c.id===v('mf_cta'));if(r.n&&c)c.saldo_actual=+c.saldo_actual+(tipo==='ingreso'?monto:-monto);
      UI.quick=null;commit(r.n?'Movimiento guardado':'Ya existía un movimiento igual')},
    metaForm(){S.metas.push({id:uid(),nombre:v('mt_nombre'),objetivo:+v('mt_obj'),actual:+v('mt_act')||0,fecha:v('mt_fecha'),aportes:[]});commit('Meta creada')},
    ctaForm(){const u4=v('ct_u4').replace(/\D/g,'').slice(-4);S.cuentas.push({id:uid(),nombre:v('ct_nombre'),tipo:v('ct_tipo'),ultimos4:u4,dia_corte:+v('ct_corte')||'',dia_limite_pago:+v('ct_lim')||'',saldo_actual:+v('ct_saldo')||0});commit('Cuenta agregada')},
    pagoForm(){S.pagos.push({id:uid(),nombre:v('pg_nombre'),monto:+v('pg_monto'),frecuencia:v('pg_frec'),proximo:v('pg_prox'),cuenta:v('pg_cta')});commit('Pago agregado')},
    asigForm(){UI.asig={monto:+v('as_monto')||0,fuente:v('as_fuente')};render()},
    ingForm(){S.plan.ingresos.push({nombre:v('in_n'),monto:+v('in_m'),tipo:v('in_t')});commit()},
    deudaForm(){S.plan.deudas.push({nombre:v('de_n'),saldo:+v('de_s'),tasa:+v('de_t'),minimo:+v('de_m')||0});commit()},
    decForm(){S.decisiones.unshift({id:uid(),fecha:today(),decision:v('dc_d'),razon:v('dc_r'),resultado:''});commit('Decisión registrada')},
    ideaForm(){const i={id:uid(),nombre:v('id_n'),desc:v('id_d'),precio:0,costo:0,fijos:0,inversion:0,cac:0,u:[0,0,0],check:{}};S.ideas.push(i);UI.ideaSel=i.id;commit()},
    watchForm(){const w={id:uid(),ticker:v('wt_t').toUpperCase(),nombre:v('wt_n'),horizonte:v('wt_h'),tesis:'',check:Array(11).fill(false),granEmpresa:false,buenPrecio:false,precioRef:'',fechaRef:'',precioAtractivo:'',veredicto:'Sin veredicto'};S.watch.push(w);UI.watchSel=w.id;commit()},
    calcForm(){UI.calc={capital:+v('tc_cap')||0,riesgo:+v('tc_r')||1,entrada:+v('tc_e')||0,stop:+v('tc_s')||0,objetivo:+v('tc_o')||0};render()},
    tradeForm(){S.trades.push({id:uid(),fecha:today(),ticker:v('tr_t').toUpperCase(),lado:v('tr_l'),entrada:+v('tr_e'),stop:+v('tr_s'),salida:+v('tr_x')||0,tam:+v('tr_q'),razon:v('tr_r'),emocion:v('tr_m')});commit('Operación registrada')},
    chatForm(){const t=$('#chatIn').value;enviarChat(t)}
  };
  if(f.dataset.aporte){const g=S.metas.find(g=>g.id===f.dataset.aporte);const m=+f.querySelector('input').value;if(g&&m>0){g.actual+=m;(g.aportes=g.aportes||[]).push({fecha:today(),monto:m});commit(`Aportaste ${money(m)}`)}return}
  F[f.id]?.();
});
document.addEventListener('keydown',ev=>{if(ev.target.id==='chatIn'&&ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();enviarChat(ev.target.value)}
  if(ev.target.id==='quickTxt'&&ev.key==='Enter'){ev.preventDefault();document.querySelector('[data-a="interpretar"]').click()}});
$('#btnMenu').addEventListener('click',()=>{const p=$('#menuPanel');p.hidden=!p.hidden;$('#btnMenu').setAttribute('aria-expanded',String(!p.hidden))});

/* tema claro/oscuro */
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function paintSwitch(){const d=isDark();$('#themeSw').setAttribute('aria-checked',String(d));$('#themeLbl').textContent=d?'Oscuro':'Claro'}
try{const t=localStorage.getItem('af_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
paintSwitch();
$('#themeSw').addEventListener('click',()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('af_theme',t)}catch(e){}paintSwitch()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',paintSwitch);
VIEW=TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):'resumen';render();store.init();
